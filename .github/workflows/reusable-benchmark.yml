name: reusable-benchmark

on:
  workflow_call:
    inputs:
      release-tag: {required: true, type: string}
      commit-sha: {required: true, type: string}
      image-digest: {required: true, type: string}
      environment: {required: true, type: string}
      suite: {required: true, type: string}
      config-hash: {required: true, type: string}

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ inputs.commit-sha }} }
      - name: Validate immutable release identity
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: test -n "$RELEASE_TAG" && test -n "$COMMIT_SHA" && test -n "$IMAGE_DIGEST"
      - name: Run fixture-safe verification
        run: bash scripts/verify_toolkit.sh
      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-toolkit-${{ inputs.release-tag }}
          path: |
            schemas
            tests/fixtures
