name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Audit CI dependencies
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python -m pip_audit -r requirements-ci.txt | tee artifacts/pip-audit.txt

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: artifacts/pip-audit.txt

      - name: Verify repository
        run: ./scripts/verify_toolkit.sh
