name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please-master
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Verify before release automation
        run: ./scripts/verify_toolkit.sh

      - name: Create release PR or GitHub release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
