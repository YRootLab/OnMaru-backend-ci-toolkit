[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onmaru-pipeline-toolkit"
version = "0.1.0"
description = "Release-aware CI/CD benchmark and evidence toolkit"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
pipeline-toolkit = "pipeline_toolkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
