global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: collector-internal
    sample_limit: 128
    static_configs:
      - targets: [collector:8888]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'otelcol_exporter_(send_failed_(spans|metric_points)_total|sent_(spans|metric_points)_total|queue_(size|capacity)|in_flight_requests)'
  - job_name: local-otlp
    scrape_protocols: [OpenMetricsText1.0.0]
    static_configs:
      - targets: [collector:8889]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
